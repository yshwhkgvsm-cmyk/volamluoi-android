# Build APK tự động: đẩy mã lên GitHub → tab Actions → chọn lần chạy → tải "VoLamLuoi-apk".
name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gói phần chạy trong game (core + addon → assets/game/vll-game.js)
        run: node tools/bundle.js
      - name: Kiểm bộ điều phối
        run: node tools/test/test-engine.js
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: VoLamLuoi-apk
          path: app/build/outputs/apk/release/*.apk
