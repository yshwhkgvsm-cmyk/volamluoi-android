plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.hungle.vll'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.hungle.vll'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    // Khóa ký cố định (tệp vll.jks trong dự án) → bản build sau cài đè được lên bản trước, không mất danh sách acc.
    signingConfigs {
        vll {
            storeFile file('vll.jks')
            storePassword 'vllandroid'
            keyAlias 'vll'
            keyPassword 'vllandroid'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.vll }
        release {
            signingConfig signingConfigs.vll
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
